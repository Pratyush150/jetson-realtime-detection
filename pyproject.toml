[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edgevision"
version = "0.1.0"
description = "Real-time object detection and tracking tuned for Jetson, Raspberry Pi and other constrained edge hardware"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Pratyush Vatsa" }]
keywords = ["jetson", "raspberry-pi", "tensorrt", "hailo", "object-detection", "tracking", "edge-ai", "ros2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
# Everything below is genuinely optional: the package imports, and the whole
# test suite passes, with none of it installed.
video = ["opencv-python>=4.5"]
onnx = ["onnxruntime>=1.12"]
torch = ["ultralytics>=8.0"]
assign = ["scipy>=1.7"]
dev = ["pytest>=7.0", "scipy>=1.7"]

[project.scripts]
edgevision-run = "edgevision.cli:main_run"
edgevision-bench = "edgevision.cli:main_bench"

[project.urls]
Homepage = "https://github.com/Pratyush150/jetson-realtime-detection"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ROS 2 (Humble and older) ships pytest plugins that are not compatible with
# pytest >= 8. They are auto-loaded from the ambient environment on any robot
# or dev box with ROS installed and break collection before a single test
# runs. Disabling them by name is harmless when ROS is absent.
addopts = "-p no:launch_testing -p no:launch_ros"
filterwarnings = ["ignore::DeprecationWarning"]
